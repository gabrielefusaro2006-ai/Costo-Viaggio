<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Costo Rotta — trova il percorso più economico</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#14161A;
    --surface:#1C1F26;
    --surface-2:#252A33;
    --border:#343A46;
    --text:#ECEAE3;
    --text-dim:#9C9A92;
    --amber:#F2A623;
    --teal:#3FA089;
    --coral:#D85A30;
    --blue:#4B8FD4;
    --purple:#8A7FE0;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ background:var(--bg); color:var(--text); font-family:'Inter', sans-serif; min-height:100vh; }
  .topbar{ display:flex; align-items:baseline; gap:14px; padding:22px 28px 18px; border-bottom:1px solid var(--border); }
  .topbar h1{ font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:22px; letter-spacing:-0.01em; }
  .topbar h1 span{color:var(--amber);}
  .topbar p{color:var(--text-dim); font-size:13px;}
  .layout{ display:grid; grid-template-columns:340px 1fr; gap:0; min-height:calc(100vh - 78px); }
  @media (max-width:860px){ .layout{grid-template-columns:1fr;} }
  .panel{ background:var(--surface); border-right:1px solid var(--border); padding:24px; display:flex; flex-direction:column; gap:18px; overflow-y:auto; }
  @media (max-width:860px){ .panel{border-right:none; border-bottom:1px solid var(--border);} }
  .field label{ display:block; font-size:12px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.06em; margin-bottom:6px; }
  .field input, .field select{ width:100%; background:var(--surface-2); border:1px solid var(--border); color:var(--text); padding:12px; border-radius:8px; font-family:'Inter', sans-serif; font-size:16px; }
  .field select{ cursor:pointer; }
  .field input:focus, .field select:focus{ outline:none; border-color:var(--amber); }
  .field-row{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .suggestions{ margin-top:6px; border:1px solid var(--border); border-radius:6px; background:var(--surface-2); max-height:140px; overflow-y:auto; display:none; }
  .suggestions.show{ display:block; }
  .suggestions div{ padding:8px 10px; font-size:13px; cursor:pointer; border-bottom:1px solid var(--border); }
  .suggestions div:last-child{ border-bottom:none; }
  .suggestions div:hover{ background:var(--surface); color:var(--amber); }
  .divider{ height:1px; background:var(--border); margin:2px 0; }
  .section-label{ font-family:'Space Grotesk', sans-serif; font-size:13px; font-weight:500; color:var(--amber); text-transform:uppercase; letter-spacing:.06em; }
  .mode-hint{ font-size:12.5px; color:var(--text-dim); margin-top:8px; line-height:1.4; }
  .toggle-group{ display:flex; gap:6px; }
  .toggle-group button.active{ border-color:var(--amber); color:var(--amber); background:rgba(242,166,35,0.08); }
  .btn-primary{ background:var(--amber); color:#1C1400; font-weight:600; border:none; padding:14px; border-radius:8px; font-size:15px; cursor:pointer; font-family:'Inter'; min-height:48px; }
  .btn-primary:hover{ background:#ffb93a; }
  .btn-primary:disabled{ opacity:.5; cursor:default; }
  .btn-outline{ background:transparent; border:1px dashed var(--border); color:var(--text-dim); padding:10px; border-radius:8px; font-size:13px; cursor:pointer; width:100%; margin-top:6px; }
  .btn-outline:hover{ border-color:var(--amber); color:var(--amber); }
  .waypoint-row{ display:flex; gap:6px; align-items:center; margin-bottom:6px; }
  .waypoint-row select{ flex:1; }
  .waypoint-remove{ background:var(--surface-2); border:1px solid var(--border); color:var(--coral); border-radius:8px; padding:0 12px; height:44px; cursor:pointer; font-size:16px; }
  .toggle-group button{ flex:1; padding:12px 8px; border-radius:8px; border:1px solid var(--border); background:var(--surface-2); color:var(--text-dim); font-size:13px; cursor:pointer; min-height:44px; }
  .status{ font-size:12.5px; color:var(--text-dim); min-height:32px; line-height:1.5; }
  .map-wrap{ position:relative; }
  #map{ width:100%; height:52vh; min-height:320px; background:#0e1013; }
  @media (max-width:860px){ #map{ height:38vh; min-height:260px; } }
  .routes{ padding:16px 16px 32px; display:flex; flex-direction:column; gap:12px; }
  @media (min-width:600px){ .routes{ padding:20px 28px 40px; } }
  .route-card{ background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:14px 14px; display:grid; grid-template-columns:1fr auto; grid-template-areas:"badge badge" "meta cost"; gap:8px 12px; align-items:center; cursor:pointer; transition:border-color .15s ease, transform .15s ease, box-shadow .15s ease; }
  .route-card .route-badge{ grid-area:badge; justify-self:start; }
  .route-card .route-meta{ grid-area:meta; }
  .route-card .route-cost{ grid-area:cost; }
  @media (min-width:600px){
    .route-card{ padding:16px 18px; grid-template-columns:auto 1fr auto; grid-template-areas:"badge meta cost"; }
  }
  .route-card:active{ transform:scale(0.99); }
  .route-card:hover{ border-color:var(--text-dim); }
  .route-card.cheapest{ border-color:var(--teal); background:rgba(63,160,137,0.06); }
  .route-card.selected{ border-color:var(--amber); box-shadow:0 0 0 2px rgba(242,166,35,0.25); }
  .route-card.selected .route-badge::before{ content:"✓ "; }
  .route-card.secondary{ opacity:.8; padding:12px 16px; }
  .route-card.secondary .route-meta .r-title{ font-size:13.5px; }
  .route-card.secondary .route-cost .amount{ font-size:16px; }
  .route-card.secondary .gauge{ height:4px; width:150px; }
  .route-badge{ font-family:'JetBrains Mono', monospace; font-size:11px; padding:4px 8px; border-radius:4px; white-space:nowrap; background:var(--surface-2); color:var(--text-dim); }
  .route-card.cheapest .route-badge{ background:var(--teal); color:#06231C; }
  .route-meta{ display:flex; flex-direction:column; gap:4px; }
  .route-meta .r-title{ font-family:'Space Grotesk'; font-size:14.5px; font-weight:500; }
  .route-meta .r-sub{ font-size:12px; color:var(--text-dim); font-family:'JetBrains Mono'; line-height:1.5; word-break:break-word; }
  .gauge{ display:flex; height:6px; border-radius:3px; overflow:hidden; margin-top:6px; width:100%; max-width:220px; }
  .gauge .fuel{ background:var(--blue); }
  .gauge .elev{ background:var(--purple); }
  .gauge .toll{ background:var(--coral); }
  .route-cost{ text-align:right; }
  .route-cost .amount{ font-family:'JetBrains Mono'; font-size:20px; font-weight:700; }
  .route-cost .label{ font-size:11px; color:var(--text-dim); }
  .legend{ display:flex; gap:16px; font-size:11.5px; color:var(--text-dim); margin-bottom:4px; flex-wrap:wrap; }
  .legend span{ display:inline-flex; align-items:center; gap:5px; }
  .legend i{ width:8px; height:8px; border-radius:2px; display:inline-block; }
  .empty-hint{ color:var(--text-dim); font-size:13.5px; padding:20px 28px; }
  .note{ font-size:11.5px; color:var(--text-dim); line-height:1.6; padding:0 28px 24px; max-width:680px; }
  .note b{ color:var(--text); }
</style>
</head>
<body>

<div class="topbar">
  <h1>Costo<span>Rotta</span></h1>
  <p>trova il percorso più economico, non solo il più corto</p>
</div>

<div class="layout">
  <div class="panel">
    <div class="toggle-group" id="mode-tabs">
      <button class="active" data-mode="percorso">Confronta percorsi</button>
      <button data-mode="budget">Budget → dove arrivo</button>
    </div>
    <div class="mode-hint" id="mode-hint">Trova il percorso più economico tra due città.</div>

    <div class="divider"></div>

    <div class="field">
      <label>Partenza</label>
      <input type="text" id="origin-input" placeholder="es. Cervaro">
      <div class="suggestions" id="origin-suggestions"></div>
      <select id="origin-preset" style="margin-top:6px;"></select>
    </div>

    <div class="divider"></div>
    <div class="section-label">Veicolo</div>

    <div class="field">
      <label>Modello (valori indicativi, modificabili)</label>
      <select id="vehicle-preset"></select>
    </div>

    <div class="field">
      <label>Tipo alimentazione</label>
      <div class="toggle-group" id="fuel-type">
        <button data-type="benzina">Benzina</button>
        <button class="active" data-type="diesel">Diesel</button>
        <button data-type="elettrico">Elettrico</button>
      </div>
    </div>

    <div class="field-row">
      <div class="field">
        <label id="consumption-label">Consumo (l/100km)</label>
        <input type="number" id="consumption" value="4.3" step="0.1" min="0">
      </div>
      <div class="field">
        <label id="price-label">Prezzo (€/l)</label>
        <input type="number" id="fuel-price" value="2.15" step="0.01" min="0">
      </div>
    </div>

    <div class="field">
      <label>Peso veicolo (kg)</label>
      <input type="number" id="vehicle-mass" value="1100" step="10" min="500">
    </div>

    <div class="divider"></div>

    <div id="mode-percorso">
      <div class="section-label">Destinazione</div>
      <div class="field">
        <label>Dove vuoi arrivare</label>
        <input type="text" id="dest-input" placeholder="es. Sora">
        <div class="suggestions" id="dest-suggestions"></div>
        <select id="dest-preset" style="margin-top:6px;"></select>
      </div>

      <div class="field">
        <label>Tappe intermedie (opzionale)</label>
        <div id="waypoints-list"></div>
        <button type="button" class="btn-outline" id="add-waypoint-btn">+ Aggiungi tappa</button>
      </div>

      <button class="btn-primary" id="calc-btn" disabled style="width:100%; margin-top:4px;">Calcola percorsi</button>
      <div class="status" id="status"></div>
    </div>

    <div id="mode-budget" style="display:none;">
      <div class="section-label">Budget</div>
      <div class="field">
        <label>Quanto vuoi spendere (€)</label>
        <input type="number" id="budget-input" value="50" step="1" min="0">
      </div>
      <button class="btn-primary" id="budget-btn" style="width:100%; margin-top:4px;">Fin dove arrivo?</button>
      <div class="status" id="budget-result"></div>
    </div>
  </div>

  <div>
    <div class="map-wrap"><div id="map"></div></div>
    <div id="routes-container">
      <div class="empty-hint">Inserisci partenza e destinazione per vedere i percorsi confrontati per costo stimato.</div>
    </div>
    <div class="note" id="disclaimer"></div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const VEHICLE_PRESETS = {
  "Fiat Grande Punto 1.3 MJ 75 CV (diesel)":     { fuelType:'diesel',    consumption:4.3,  mass:1100, price:2.15 },
  "Fiat Grande Panda Mild Hybrid (benzina)":     { fuelType:'benzina',   consumption:5.3,  mass:1200, price:1.89 },
  "Peugeot 208 2014 1.2 (benzina)":              { fuelType:'benzina',   consumption:5.5,  mass:1090, price:1.89 },
  "Opel Corsa 2010 1.3 CDTI ~74 CV (diesel)":    { fuelType:'diesel',    consumption:4.5,  mass:1150, price:2.15 },
  "Ford Fiesta ST-Line 100 CV 2017 (benzina)":   { fuelType:'benzina',   consumption:5.0,  mass:1150, price:1.89 },
  "Mini Cooper D 2005 69 CV (diesel)":           { fuelType:'diesel',    consumption:4.5,  mass:1140, price:2.15 },
  "Fiat Panda (benzina)":        { fuelType:'benzina',   consumption:5.8,  mass:1000, price:1.89 },
  "Lancia Ypsilon (benzina)":    { fuelType:'benzina',   consumption:5.5,  mass:1080, price:1.89 },
  "Fiat 500 (benzina)":          { fuelType:'benzina',   consumption:5.3,  mass:970,  price:1.89 },
  "Dacia Sandero (benzina)":     { fuelType:'benzina',   consumption:5.9,  mass:1090, price:1.89 },
  "Peugeot 208 (benzina)":       { fuelType:'benzina',   consumption:5.6,  mass:1150, price:1.89 },
  "Toyota Yaris Cross (ibrida)": { fuelType:'benzina',   consumption:4.4,  mass:1180, price:1.89 },
  "Volkswagen Golf (diesel)":    { fuelType:'diesel',    consumption:4.8,  mass:1350, price:2.15 },
  "Fiat Tipo (diesel)":          { fuelType:'diesel',    consumption:5.0,  mass:1300, price:2.15 },
  "Jeep Renegade (diesel)":      { fuelType:'diesel',    consumption:5.6,  mass:1500, price:2.15 },
  "Fiat 500e (elettrico)":       { fuelType:'elettrico', consumption:14.5, mass:1400, price:0.28 },
  "Tesla Model Y (elettrico)":   { fuelType:'elettrico', consumption:16.5, mass:1980, price:0.28 },
};

const SAVED_PLACES = [
  { name:'Casa Dani',    lat:41.475767, lon:13.846708 },
  { name:'Parcheggione', lat:41.487278, lon:13.832054 },
  { name:'Fiume',        lat:41.443612, lon:13.834909 },
  { name:'Remo',         lat:41.444786, lon:13.840406 },
  { name:'Casa Pantano', lat:41.469042, lon:13.906432 },
  { name:'Casa Nunr_',   lat:41.446971, lon:13.830782 },
  { name:'Casa Rom',     lat:41.460591, lon:13.895556 },
];
function fillPlacesSelect(selectEl, placeholder){
  selectEl.innerHTML = '';
  const opt0 = document.createElement('option');
  opt0.value = ''; opt0.textContent = placeholder;
  selectEl.appendChild(opt0);
  SAVED_PLACES.forEach(p => {
    const o = document.createElement('option');
    o.value = p.name; o.textContent = p.name;
    selectEl.appendChild(o);
  });
}

const state = { origin:null, dest:null, fuelType:'benzina', routes:[], selectedIdx:null, tollWays:[], waypoints:[] };

function sleep(ms){ return new Promise(r => setTimeout(r, ms)); }
async function fetchWithTimeout(url, options = {}, timeoutMs = 8000){
  const controller = new AbortController();
  const id = setTimeout(() => controller.abort(), timeoutMs);
  try{ return await fetch(url, { ...options, signal: controller.signal }); }
  finally{ clearTimeout(id); }
}

const OVERPASS_ENDPOINTS = [
  'https://overpass-api.de/api/interpreter',
  'https://overpass.kumi.systems/api/interpreter',
  'https://overpass.openstreetmap.ru/api/interpreter'
];
async function fetchOverpass(query, timeoutMs = 12000){
  let lastErr;
  for(const endpoint of OVERPASS_ENDPOINTS){
    try{
      const res = await fetchWithTimeout(endpoint, { method:'POST', body:query }, timeoutMs);
      if(res.ok) return await res.json();
      lastErr = new Error('HTTP ' + res.status);
    }catch(e){ lastErr = e; }
  }
  throw lastErr || new Error('Nessun server Overpass disponibile');
}

const map = L.map('map', { zoomControl:true }).setView([41.6, 13.8], 9);
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
  attribution:'&copy; OpenStreetMap contributors &copy; CARTO', maxZoom:19
}).addTo(map);

let routeLayers = [], markers = [];

function setStatus(msg){ document.getElementById('status').textContent = msg; }
function updateCalcBtn(){ document.getElementById('calc-btn').disabled = !(state.origin && state.dest); }

// ---------- preset veicolo ----------
const presetSelect = document.getElementById('vehicle-preset');
const customOpt = document.createElement('option');
customOpt.value = 'custom'; customOpt.textContent = 'Personalizzato…';
presetSelect.appendChild(customOpt);
Object.keys(VEHICLE_PRESETS).forEach(name => {
  const opt = document.createElement('option');
  opt.value = name; opt.textContent = name;
  presetSelect.appendChild(opt);
});
presetSelect.value = 'Fiat Grande Punto 1.3 MJ 75 CV (diesel)';

function applyFuelType(type, overrides){
  document.querySelectorAll('#fuel-type button').forEach(b => b.classList.toggle('active', b.dataset.type === type));
  state.fuelType = type;
  const consLabel = document.getElementById('consumption-label');
  const priceLabel = document.getElementById('price-label');
  const cons = document.getElementById('consumption');
  const price = document.getElementById('fuel-price');
  if(type === 'elettrico'){
    consLabel.textContent = 'Consumo (kWh/100km)'; priceLabel.textContent = 'Prezzo (€/kWh)';
    cons.value = overrides?.consumption ?? 16; price.value = overrides?.price ?? 0.28;
  } else if(type === 'diesel'){
    consLabel.textContent = 'Consumo (l/100km)'; priceLabel.textContent = 'Prezzo (€/l)';
    cons.value = overrides?.consumption ?? 5.2; price.value = overrides?.price ?? 2.15;
  } else {
    consLabel.textContent = 'Consumo (l/100km)'; priceLabel.textContent = 'Prezzo (€/l)';
    cons.value = overrides?.consumption ?? 5.8; price.value = overrides?.price ?? 1.89;
  }
  if(overrides?.mass) document.getElementById('vehicle-mass').value = overrides.mass;
}

presetSelect.addEventListener('change', () => {
  if(presetSelect.value === 'custom') return;
  const p = VEHICLE_PRESETS[presetSelect.value];
  applyFuelType(p.fuelType, p);
});
document.querySelectorAll('#fuel-type button').forEach(btn => {
  btn.addEventListener('click', () => {
    presetSelect.value = 'custom';
    applyFuelType(btn.dataset.type);
  });
});
applyFuelType('diesel', VEHICLE_PRESETS['Fiat Grande Punto 1.3 MJ 75 CV (diesel)']);

document.querySelectorAll('#mode-tabs button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#mode-tabs button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const mode = btn.dataset.mode;
    document.getElementById('mode-percorso').style.display = mode === 'percorso' ? '' : 'none';
    document.getElementById('mode-budget').style.display = mode === 'budget' ? '' : 'none';
    document.getElementById('routes-container').style.display = mode === 'percorso' ? '' : 'none';
    document.getElementById('mode-hint').textContent = mode === 'percorso'
      ? 'Trova il percorso più economico tra due città.'
      : 'Peschiamo mete interessanti in Italia e dintorni e controlliamo quali rientrano nel tuo budget. Il risultato cambia a ogni calcolo.';
  });
});

// ---------- geocoding / autocomplete ----------
async function geocode(query){
  const url = `https://nominatim.openstreetmap.org/search?format=json&limit=5&countrycodes=it&accept-language=it&q=${encodeURIComponent(query)}`;
  const res = await fetch(url);
  if(!res.ok) throw new Error('Geocodifica fallita');
  return res.json();
}
function wireAutocomplete(inputId, suggBoxId, onPick){
  const input = document.getElementById(inputId), box = document.getElementById(suggBoxId);
  let debounce;
  input.addEventListener('input', () => {
    clearTimeout(debounce);
    const q = input.value.trim();
    if(q.length < 3){ box.classList.remove('show'); return; }
    debounce = setTimeout(async () => {
      try{
        const results = await geocode(q);
        if(!results.length){ box.classList.remove('show'); return; }
        box.innerHTML = '';
        results.forEach(r => {
          const div = document.createElement('div');
          div.textContent = r.display_name;
          div.onclick = () => {
            input.value = r.display_name; box.classList.remove('show');
            onPick({ lat: parseFloat(r.lat), lon: parseFloat(r.lon), label: r.display_name });
          };
          box.appendChild(div);
        });
        box.classList.add('show');
      }catch(e){}
    }, 400);
  });
  document.addEventListener('click', (e) => { if(!box.contains(e.target) && e.target !== input) box.classList.remove('show'); });
}
wireAutocomplete('origin-input', 'origin-suggestions', (loc) => { state.origin = loc; updateCalcBtn(); });
wireAutocomplete('dest-input', 'dest-suggestions', (loc) => { state.dest = loc; updateCalcBtn(); });

// ---------- luoghi salvati: partenza, destinazione, tappe ----------
const originPreset = document.getElementById('origin-preset');
const destPreset = document.getElementById('dest-preset');
fillPlacesSelect(originPreset, 'Luoghi salvati…');
fillPlacesSelect(destPreset, 'Luoghi salvati…');
originPreset.addEventListener('change', () => {
  const p = SAVED_PLACES.find(x => x.name === originPreset.value);
  if(!p) return;
  document.getElementById('origin-input').value = p.name;
  state.origin = { lat:p.lat, lon:p.lon, label:p.name };
  updateCalcBtn();
});
destPreset.addEventListener('change', () => {
  const p = SAVED_PLACES.find(x => x.name === destPreset.value);
  if(!p) return;
  document.getElementById('dest-input').value = p.name;
  state.dest = { lat:p.lat, lon:p.lon, label:p.name };
  updateCalcBtn();
});

function renderWaypointRows(){
  const container = document.getElementById('waypoints-list');
  container.innerHTML = '';
  state.waypoints.forEach((wp, idx) => {
    const row = document.createElement('div');
    row.className = 'waypoint-row';
    const sel = document.createElement('select');
    fillPlacesSelect(sel, `Tappa ${idx + 1}: scegli luogo…`);
    sel.value = wp.name || '';
    sel.dataset.idx = idx;
    sel.addEventListener('change', () => {
      const p = SAVED_PLACES.find(x => x.name === sel.value);
      if(p) state.waypoints[idx] = { lat:p.lat, lon:p.lon, name:p.name };
    });
    const removeBtn = document.createElement('button');
    removeBtn.type = 'button'; removeBtn.className = 'waypoint-remove'; removeBtn.textContent = '×';
    removeBtn.addEventListener('click', () => { state.waypoints.splice(idx, 1); renderWaypointRows(); });
    row.appendChild(sel); row.appendChild(removeBtn);
    container.appendChild(row);
  });
}
document.getElementById('add-waypoint-btn').addEventListener('click', () => {
  if(state.waypoints.length >= 5) return; // limite ragionevole di tappe
  state.waypoints.push({ lat:null, lon:null, name:'' });
  renderWaypointRows();
});

// ---------- routing ----------
function midpointOffset(o, d, fracPerp, side){
  const midLat = (o.lat + d.lat) / 2, midLon = (o.lon + d.lon) / 2;
  const dLat = d.lat - o.lat, dLon = d.lon - o.lon;
  const len = Math.sqrt(dLat*dLat + dLon*dLon) || 1e-6;
  const perpLat = -dLon / len, perpLon = dLat / len;
  const offset = len * fracPerp * side;
  return { lat: midLat + perpLat * offset, lon: midLon + perpLon * offset };
}
async function fetchViaRoute(o, d, via){
  const url = `https://router.project-osrm.org/route/v1/driving/${o.lon},${o.lat};${via.lon},${via.lat};${d.lon},${d.lat}?overview=full&geometries=geojson&steps=false`;
  const res = await fetch(url);
  if(!res.ok) return null;
  const data = await res.json();
  if(data.code !== 'Ok' || !data.routes?.length) return null;
  return data.routes[0];
}
async function fetchRoutes(o, d){
  const collected = [];
  try{
    const url = `https://router.project-osrm.org/route/v1/driving/${o.lon},${o.lat};${d.lon},${d.lat}?alternatives=true&overview=full&geometries=geojson&steps=false`;
    const res = await fetch(url);
    if(res.ok){ const data = await res.json(); if(data.code === 'Ok') collected.push(...data.routes); }
  }catch(e){ /* proviamo comunque le deviazioni */ }
  // forziamo percorsi realmente alternativi passando per un punto laterale, invece di affidarci
  // a exclude=motorway (spesso non supportato dal server pubblico OSRM)
  for(const side of [1, -1]){
    try{
      const via = midpointOffset(o, d, 0.18, side);
      const r = await fetchViaRoute(o, d, via);
      if(r) collected.push(r);
    }catch(e){ /* nessuna deviazione valida da questo lato */ }
  }
  if(!collected.length) throw new Error('Nessun percorso trovato');
  const distinct = [];
  for(const r of collected){
    const dup = distinct.some(d2 =>
      Math.abs(d2.distance - r.distance) / Math.max(d2.distance, r.distance) < 0.02 &&
      Math.abs(d2.duration - r.duration) / Math.max(d2.duration, r.duration) < 0.02
    );
    if(!dup) distinct.push(r);
  }
  distinct.sort((a, b) => a.distance - b.distance);
  return distinct.slice(0, 4);
}
async function fetchSingleRoute(o, d){
  const url = `https://router.project-osrm.org/route/v1/driving/${o.lon},${o.lat};${d.lon},${d.lat}?alternatives=false&overview=full&geometries=geojson&steps=false`;
  const res = await fetch(url);
  if(!res.ok) throw new Error('Routing fallito');
  const data = await res.json();
  if(data.code !== 'Ok' || !data.routes.length) throw new Error('Nessun percorso trovato');
  return data.routes[0];
}
async function fetchMultiPointRoute(points){
  const coordStr = points.map(p => `${p.lon},${p.lat}`).join(';');
  const url = `https://router.project-osrm.org/route/v1/driving/${coordStr}?overview=full&geometries=geojson&steps=false`;
  const res = await fetch(url);
  if(!res.ok) throw new Error('Routing fallito');
  const data = await res.json();
  if(data.code !== 'Ok' || !data.routes?.length) throw new Error('Nessun percorso trovato con queste tappe');
  return data.routes[0];
}

// ---------- pedaggi reali (OSM toll=yes) ----------
function sampleEvenly(arr, n){
  if(arr.length <= n) return arr;
  const step = (arr.length - 1) / (n - 1), out = [];
  for(let i = 0; i < n; i++) out.push(arr[Math.round(i * step)]);
  return out;
}
async function fetchTollWays(bbox){
  const q = `[out:json][timeout:25];(way["highway"="motorway"]["toll"="yes"](${bbox.join(',')});way["toll"="yes"]["highway"~"trunk|primary"](${bbox.join(',')}););out geom;`;
  const data = await fetchOverpass(q, 12000);
  return (data.elements || []).filter(e => e.geometry);
}
function haversineKm(a, b){
  const R = 6371, dLat = (b[0]-a[0])*Math.PI/180, dLon = (b[1]-a[1])*Math.PI/180;
  const lat1 = a[0]*Math.PI/180, lat2 = b[0]*Math.PI/180;
  const h = Math.sin(dLat/2)**2 + Math.cos(lat1)*Math.cos(lat2)*Math.sin(dLon/2)**2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
function distPointToSegmentM(p, a, b){
  const R = 6371000;
  const toXY = (pt, ref) => [
    (pt[1]-ref[1]) * Math.PI/180 * R * Math.cos(ref[0]*Math.PI/180),
    (pt[0]-ref[0]) * Math.PI/180 * R
  ];
  const P = toXY(p, a), A = [0,0], B = toXY(b, a);
  const ABx = B[0]-A[0], ABy = B[1]-A[1], APx = P[0]-A[0], APy = P[1]-A[1];
  const len2 = ABx*ABx + ABy*ABy;
  let t = len2 === 0 ? 0 : (APx*ABx + APy*ABy) / len2;
  t = Math.max(0, Math.min(1, t));
  const Cx = A[0]+ABx*t, Cy = A[1]+ABy*t;
  return Math.hypot(P[0]-Cx, P[1]-Cy);
}
function findTollWayMatch(p, tollWays, thresholdM = 30){
  for(const way of tollWays){
    const g = way.geometry;
    for(let i = 1; i < g.length; i++){
      if(distPointToSegmentM(p, [g[i-1].lat, g[i-1].lon], [g[i].lat, g[i].lon]) <= thresholdM) return way;
    }
  }
  return null;
}
// tariffa media indicativa per veicoli di classe standard sulla rete italiana (fonti pubbliche: ~0,07-0,09 €/km)
const AVG_TOLL_RATE_PER_KM = 0.078;
function computeTollSegments(coordsLatLon, tollWays){
  if(!tollWays.length) return { tolledKm:0, segments:[], names:[] };
  const sampled = sampleEvenly(coordsLatLon, Math.min(coordsLatLon.length, 250));
  let tolledKm = 0;
  const names = new Set();
  const segments = [];
  let current = null;
  for(let i = 1; i < sampled.length; i++){
    const mid = [(sampled[i-1][0]+sampled[i][0])/2, (sampled[i-1][1]+sampled[i][1])/2];
    const segKm = haversineKm(sampled[i-1], sampled[i]);
    const match = findTollWayMatch(mid, tollWays);
    if(match){
      tolledKm += segKm;
      names.add(match.tags?.ref || match.tags?.name || 'tratto a pagamento');
      if(!current){ current = [sampled[i-1]]; }
      current.push(sampled[i]);
    }else if(current){
      segments.push(current); current = null;
    }
  }
  if(current) segments.push(current);
  return { tolledKm, segments, names: Array.from(names) };
}

// ---------- dislivello (topografia) ----------
async function fetchElevations(coordsLatLon){
  const sampled = sampleEvenly(coordsLatLon, 30);
  const locations = sampled.map(c => ({ latitude:c[0], longitude:c[1] }));
  const res = await fetchWithTimeout('https://api.open-elevation.com/api/v1/lookup', {
    method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ locations })
  }, 9000);
  if(!res.ok) throw new Error('elevazione non disponibile');
  const data = await res.json();
  return data.results.map(r => r.elevation);
}
function ascentDescent(elevations){
  let asc = 0, desc = 0;
  for(let i = 1; i < elevations.length; i++){
    const d = elevations[i] - elevations[i-1];
    if(d > 0) asc += d; else desc += -d;
  }
  return { asc, desc };
}
function elevationExtraCost(asc, desc, massKg, fuelType, price){
  const g = 9.81;
  let energyDensity, efficiency, regen;
  if(fuelType === 'elettrico'){ energyDensity = 3.6e6; efficiency = 0.85; regen = 0.55; }
  else if(fuelType === 'diesel'){ energyDensity = 35.8e6; efficiency = 0.22; regen = 0.08; }
  else { energyDensity = 32.0e6; efficiency = 0.20; regen = 0.08; }
  const extraUp = (massKg * g * asc) / (energyDensity * efficiency);
  const extraDown = -(massKg * g * desc * regen) / (energyDensity * efficiency);
  const netUnits = extraUp + extraDown;
  return { netUnits, cost: netUnits * price };
}

// ---------- calcolo costo per percorso ----------
async function enrichRoute(raw, tollWays){
  const coordsLatLon = raw.geometry.coordinates.map(c => [c[1], c[0]]);
  const distKm = raw.distance / 1000;
  const durationMin = raw.duration / 60;
  const consumption = parseFloat(document.getElementById('consumption').value) || 0;
  const price = parseFloat(document.getElementById('fuel-price').value) || 0;
  const mass = parseFloat(document.getElementById('vehicle-mass').value) || 1200;

  const baseFuelCost = distKm * (consumption / 100) * price;

  let asc = 0, desc = 0, elevError = false;
  try{
    const elevations = await fetchElevations(coordsLatLon);
    ({ asc, desc } = ascentDescent(elevations));
  }catch(e){ elevError = true; }
  const elev = elevationExtraCost(asc, desc, mass, state.fuelType, price);

  const toll = computeTollSegments(coordsLatLon, tollWays);
  const tollCost = toll.tolledKm * AVG_TOLL_RATE_PER_KM;

  const fuelCost = baseFuelCost + elev.cost;
  const total = fuelCost + tollCost;

  return { distKm, durationMin, fuelCost, elevCost: elev.cost, tollCost, tolledKm: toll.tolledKm, tollNames: toll.names, tollSegments: toll.segments, asc, desc, total, elevError };
}

// ---------- rendering ----------
function clearMap(){ routeLayers.forEach(l => map.removeLayer(l)); markers.forEach(m => map.removeLayer(m)); routeLayers = []; markers = []; }
function drawRoute(route, idx, isCheapest, tollSegments){
  const coords = route.geometry.coordinates.map(c => [c[1], c[0]]);
  const color = isCheapest ? '#3FA089' : (idx === state.selectedIdx ? '#F2A623' : '#4A5568');
  const weight = isCheapest || idx === state.selectedIdx ? 5 : 3;
  const line = L.polyline(coords, { color, weight, opacity: isCheapest ? 0.95 : 0.5 }).addTo(map);
  line.on('click', () => selectRoute(idx));
  routeLayers.push(line);
  // evidenzia in rosso i tratti effettivamente a pagamento, solo per il percorso in evidenza
  if((isCheapest || idx === state.selectedIdx) && tollSegments?.length){
    tollSegments.forEach(seg => {
      const tollLine = L.polyline(seg, { color:'#D85A30', weight:weight + 2, opacity:0.95 }).addTo(map);
      routeLayers.push(tollLine);
    });
  }
}
function selectRoute(idx){ state.selectedIdx = idx; renderMap(); renderRoutes(); }
function renderMap(){
  clearMap();
  const cheapestIdx = state.routes.reduce((best, r, i) => r.cost.total < state.routes[best].cost.total ? i : best, 0);
  state.routes.forEach((r, i) => { if(i !== cheapestIdx && i !== state.selectedIdx) drawRoute(r.raw, i, false, r.cost.tollSegments); });
  state.routes.forEach((r, i) => { if(i === cheapestIdx || i === state.selectedIdx) drawRoute(r.raw, i, i === cheapestIdx, r.cost.tollSegments); });
  markers.push(L.circleMarker([state.origin.lat, state.origin.lon], { radius:6, color:'#ECEAE3', fillColor:'#ECEAE3', fillOpacity:1 }).addTo(map));
  markers.push(L.circleMarker([state.dest.lat, state.dest.lon], { radius:6, color:'#F2A623', fillColor:'#F2A623', fillOpacity:1 }).addTo(map));
  const allCoords = state.routes.flatMap(r => r.raw.geometry.coordinates.map(c => [c[1], c[0]]));
  if(allCoords.length) map.fitBounds(L.latLngBounds(allCoords), { padding:[30,30] });
}
function renderRoutes(){
  const container = document.getElementById('routes-container');
  const order = state.routes.map((r, i) => i).sort((a, b) => state.routes[a].cost.total - state.routes[b].cost.total);
  const fastestIdx = state.routes.reduce((best, r, i) => r.raw.duration < state.routes[best].raw.duration ? i : best, 0);
  const legend = `<div class="legend">
    <span><i style="background:#4B8FD4"></i>carburante base</span>
    <span><i style="background:#8A7FE0"></i>effetto dislivello</span>
    <span><i style="background:#D85A30"></i>pedaggio (tratte reali)</span>
  </div>`;
  container.innerHTML = `<div class="routes">${legend}` + order.map((i, rankIdx) => {
    const r = state.routes[i];
    const c = r.cost;
    const rank = rankIdx + 1;
    const isCheapest = rank === 1;
    const isSecondary = rank === 2 || rank === 3;
    const fuelPct = Math.max(0, Math.round((c.fuelCost - c.elevCost) / c.total * 100)) || 0;
    const elevPct = Math.max(0, Math.round(c.elevCost / c.total * 100)) || 0;
    const tollPct = Math.max(0, 100 - fuelPct - elevPct);
    let badge;
    if(rank === 1) badge = 'più economico';
    else if(rank === 2) badge = '2° più economico';
    else if(rank === 3) badge = '3° più economico';
    else badge = `alternativa ${rank}`;
    if(i === fastestIdx && rank !== 1) badge += ' · più veloce';
    if(r.hasWaypoints) badge += ' · con tappe';
    const elevNote = c.elevError ? 'dislivello non disponibile' : `salita ${Math.round(c.asc)} m / discesa ${Math.round(c.desc)} m`;
    const rc = r.returnCost;
    const returnLine = rc
      ? `<div style="font-size:11.5px; color:var(--text-dim); margin-top:6px; padding-top:6px; border-top:1px dashed var(--border);">↩︎ Ritorno: €${rc.total.toFixed(2)} · ${rc.distKm.toFixed(0)} km · ${Math.round(rc.durationMin)} min</div>`
      : `<div style="font-size:11.5px; color:var(--text-dim); margin-top:6px;">Ritorno non disponibile</div>`;
    return `
      <div class="route-card ${isCheapest ? 'cheapest' : ''} ${isSecondary ? 'secondary' : ''} ${i === state.selectedIdx ? 'selected' : ''}" data-idx="${i}">
        <div class="route-badge">${badge}</div>
        <div class="route-meta">
          <div class="r-title">${c.distKm.toFixed(0)} km · ${Math.round(c.durationMin)} min</div>
          <div class="r-sub">carburante €${c.fuelCost.toFixed(2)} · pedaggi €${c.tollCost.toFixed(2)}${c.tollNames?.length ? ` (${c.tollNames.join(', ')} · ${c.tolledKm.toFixed(1)} km)` : ' (nessun tratto a pagamento rilevato)'} · ${elevNote}</div>
          <div class="gauge"><div class="fuel" style="width:${fuelPct}%"></div><div class="elev" style="width:${elevPct}%"></div><div class="toll" style="width:${tollPct}%"></div></div>
          ${returnLine}
        </div>
        <div class="route-cost"><div class="amount">€${c.total.toFixed(2)}</div><div class="label">andata</div></div>
      </div>`;
  }).join('') + `</div>`;
  container.querySelectorAll('.route-card').forEach(card => card.addEventListener('click', () => selectRoute(parseInt(card.dataset.idx))));
  document.getElementById('disclaimer').innerHTML =
    '<b>Come viene calcolato ora:</b> ogni percorso mostra il costo di andata (in evidenza) e, sotto, quello di ritorno — possono differire per il dislivello reale nelle due direzioni. I tratti a pagamento sono individuati automaticamente su OpenStreetMap ed evidenziati in rosso sulla mappa, con il nome del tratto e i km percorsi. Il costo pedaggio usa una tariffa media indicativa di circa €0,078/km. Con le tappe intermedie attive, viene calcolato un solo percorso fisso (niente alternative) che passa per tutte le tappe nell\'ordine scelto, sia all\'andata che al ritorno. Fonti: OSRM/OpenStreetMap (percorsi), Overpass API (tratte a pagamento), Open-Elevation (quota).';
}

function shuffleArray(arr){
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

let reachableMarkers = [];
function clearReachableMarkers(){ reachableMarkers.forEach(m => map.removeLayer(m)); reachableMarkers = []; }
function renderReachablePlaces(results, budget){
  const el = document.getElementById('budget-result');
  const rows = results.map(r => `
    <div style="display:flex; justify-content:space-between; gap:10px; font-size:12.5px; background:var(--surface-2); border:1px solid var(--border); border-radius:6px; padding:8px 10px; margin-top:6px;">

  el.innerHTML = `<div>Con €${budget.toFixed(2)} potresti raggiungere:</div>${rows}
    <div style="margin-top:8px; font-size:11px; color:var(--text-dim); line-height:1.5;">Selezione casuale da un elenco di mete in Italia ed Europa vicina — premi di nuovo per pescarne altre. Costo con carburante + dislivello reali; pedaggio stimato in modo approssimativo per i tragitti lunghi (qui non verifichiamo la tratta esatta, a differenza del confronto percorsi).</div>`;
  clearReachableMarkers();
  results.forEach(r => {

async function computeReachablePlaces(){
  const resEl = document.getElementById('budget-result');
  if(!state.origin){ resEl.textContent = 'Imposta una partenza per calcolare dove puoi arrivare.'; return; }
  const budget = parseFloat(document.getElementById('budget-input').value) || 0;
  const consumption = parseFloat(document.getElementById('consumption').value) || 0;
  const price = parseFloat(document.getElementById('fuel-price').value) || 0;
  if(budget <= 0 || consumption <= 0 || price <= 0){ resEl.textContent = 'Inserisci budget, consumo e prezzo validi.'; return; }

  const lat = state.origin.lat, lon = state.origin.lon;
  const roughMaxKm = budget / ((consumption / 100) * price); // stima grezza solo carburante, per scartare i candidati palesemente troppo lontani

  const withDist = DESTINATIONS.map(d => ({ ...d, distKm: haversineKm([lat, lon], [d.lat, d.lon]) }));
  const plausible = withDist.filter(d => d.distKm <= roughMaxKm * 1.6); // margine: la strada reale è più lunga della linea d'aria
  const pool = plausible.length ? plausible : withDist;
  const toTry = shuffleArray(pool).slice(0, 14); // sottoinsieme casuale, limitato per non sovraccaricare i servizi gratuiti

  const results = [];
  let errorCount = 0;
  for(let i = 0; i < toTry.length; i++){
    const cand = toTry[i];
    resEl.textContent = `Calcolo il costo reale verso alcune mete… (${i + 1}/${toTry.length})`;
    try{
      const raw = await fetchSingleRoute({ lat, lon }, { lat: cand.lat, lon: cand.lon });
      const cost = await enrichRoute(raw, []); // niente lookup pedaggi puntuale: l'area copre più regioni/stati, troppo pesante da interrogare
      const tollEstimate = cost.distKm > 50 ? cost.distKm * 0.4 * AVG_TOLL_RATE_PER_KM : 0; // stima approssimativa per i tragitti lunghi
      const total = cost.total + tollEstimate;
      if(total <= budget) results.push({ name: cand.name, lat: cand.lat, lon: cand.lon, distKm: cost.distKm, cost: { ...cost, tollCost: cost.tollCost + tollEstimate, total } });
    }catch(e){ errorCount++; }
    await sleep(150); // evita di sovraccaricare i servizi pubblici gratuiti
  }

  if(!results.length){
    if(errorCount === toTry.length){
      resEl.textContent = 'I servizi di routing non hanno risposto correttamente. Riprova tra qualche istante.';
    }else{
      resEl.textContent = 'Nessuna delle mete provate rientra in questo budget. Prova ad aumentarlo o premi di nuovo per pescarne altre.';
    }
    return;
  }
  const finalResults = shuffleArray(results).slice(0, 8); // ordine diverso a ogni calcolo, anche a parità di mete trovate
  renderReachablePlaces(finalResults, budget);
}
document.getElementById('budget-btn').addEventListener('click', computeReachablePlaces);

document.getElementById('calc-btn').addEventListener('click', async () => {
  if(!state.origin || !state.dest) return;
  const btn = document.getElementById('calc-btn');
  btn.disabled = true;
  try{
    const validWaypoints = state.waypoints.filter(w => w.lat != null);
    let enriched;

    if(validWaypoints.length){
      // con tappe intermedie: un solo percorso fisso (niente alternative), andata e ritorno lungo le stesse tappe
      setStatus('Calcolo percorso con tappe…');
      const pointsFwd = [state.origin, ...validWaypoints, state.dest];
      const pointsRet = [state.dest, ...validWaypoints.slice().reverse(), state.origin];
      const rawFwd = await fetchMultiPointRoute(pointsFwd);
      const rawRet = await fetchMultiPointRoute(pointsRet);

      const allCoords = rawFwd.geometry.coordinates.concat(rawRet.geometry.coordinates).map(c => [c[1], c[0]]);
      const lats = allCoords.map(c => c[0]), lons = allCoords.map(c => c[1]);
      const bbox = [Math.min(...lats) - 0.03, Math.min(...lons) - 0.03, Math.max(...lats) + 0.03, Math.max(...lons) + 0.03];
      setStatus('Verifica tratte a pagamento…');
      let tollWays = [];
      try{ tollWays = await fetchTollWays(bbox); }catch(e){ /* proseguiamo senza pedaggi se non disponibili */ }

      setStatus('Calcolo costi andata e ritorno…');
      const fCost = await enrichRoute(rawFwd, tollWays);
      const rCost = await enrichRoute(rawRet, tollWays);
      enriched = [{ raw:rawFwd, cost:fCost, returnRaw:rawRet, returnCost:rCost, hasWaypoints:true }];

    }else{
      // senza tappe: alternative multiple, con andata e ritorno abbinati per ciascuna
      setStatus('Ricerca percorsi…');
      const rawRoutes = await fetchRoutes(state.origin, state.dest);

      const allCoords = rawRoutes.flatMap(r => r.geometry.coordinates.map(c => [c[1], c[0]]));
      const lats = allCoords.map(c => c[0]), lons = allCoords.map(c => c[1]);
      const bbox = [Math.min(...lats) - 0.03, Math.min(...lons) - 0.03, Math.max(...lats) + 0.03, Math.max(...lons) + 0.03];

      setStatus('Verifica tratte a pagamento…');
      let tollWays = [];
      try{ tollWays = await fetchTollWays(bbox); }
      catch(e){ setStatus('Attenzione: dati pedaggi non disponibili in questo momento, stimati a €0.'); }

      setStatus('Ricerca percorsi di ritorno…');
      let returnRaws = [];
      try{ returnRaws = await fetchRoutes(state.dest, state.origin); }catch(e){ /* proseguiamo senza ritorno se non disponibile */ }

      setStatus(`Calcolo costi andata e ritorno per ${rawRoutes.length} percorso/i…`);
      enriched = [];
      for(const raw of rawRoutes){
        const cost = await enrichRoute(raw, tollWays);
        // abbina il ritorno più simile per distanza, come proxy della "stessa strada" percorsa al contrario
        let bestReturn = null, bestDiff = Infinity;
        for(const rr of returnRaws){
          const diff = Math.abs(rr.distance - raw.distance);
          if(diff < bestDiff){ bestDiff = diff; bestReturn = rr; }
        }
        const returnCost = bestReturn ? await enrichRoute(bestReturn, tollWays) : null;
        enriched.push({ raw, cost, returnRaw:bestReturn, returnCost });
      }
    }

    state.routes = enriched;
    state.selectedIdx = null;
    setStatus(`${state.routes.length} percorso/i confrontato/i (andata e ritorno).`);
    renderMap();
    renderRoutes();
  }catch(e){
    setStatus('Errore: ' + e.message);
  }finally{
    btn.disabled = false;
  }
});
</script>
